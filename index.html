<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FM森田 お便り･リクエスト募集フォーム</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'Inter', 'sans-serif'],
            display: ['"Dela Gothic One"', '"Noto Sans JP"', 'sans-serif'],
          },
          colors: {
            sol: {
              yellow: '#FFE600',
              bg: '#101412',
              board: '#16231C',
              card: '#181E1B'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #101412;
      color: #F8FAFC;
    }
    /* Simple Blackboard Texture */
    .chalkboard {
      background-color: #16231C;
      background-image: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.25) 100%);
      border: 3px solid #5C4028;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    }
    .sol-card {
      background-color: #181E1B;
      border: 2px solid rgba(255, 255, 255, 0.14);
    }
    .sol-btn {
      box-shadow: 3px 3px 0px #000000;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .sol-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #000000;
    }
    .sol-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0px #000000;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-sol-yellow selection:text-black">

  <!-- TOP BAR -->
  <div class="bg-sol-yellow text-black text-xs font-black py-1.5 px-4 border-b-2 border-black">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <span class="font-display tracking-wider">FM MORITA  by  ACN Kansai Community 506 Music Club（50.6MHz）</span>
    </div>
  </div>

  <!-- MAIN SINGLE-PAGE CONTAINER -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 space-y-8">

    <!-- HEADER / BLACKBOARD BANNER -->
    <header class="chalkboard rounded-xl p-6 sm:p-7">
      <div class="flex items-center gap-4">
        <!-- Musical Note Emblem -->
        <div class="w-14 h-14 rounded-xl bg-sol-yellow border-2 border-black flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" class="w-8 h-8 text-black" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </div>
        <div>
          <h1 class="font-display text-2xl sm:text-3xl text-white tracking-tight mt-0.5">
            FM森田 お便り･リクエスト募集フォーム
          </h1>
        </div>
      </div>
    </header>

    <!-- SECTION 1: SIMPLE 2-FIELD SUBMISSION FORM -->
    <section class="sol-card rounded-xl p-6 sm:p-7 border-2 border-sol-yellow">
      <form id="radioSubmissionForm" class="space-y-5" novalidate>
        <!-- Field 1: ラジオネーム -->
        <div>
          <label for="inputRadioName" class="block text-sm font-bold text-white mb-2">
            ラジオネーム <span class="text-sol-yellow">*</span>
          </label>
          <input
            id="inputRadioName"
            type="text"
            required
            maxlength="50"
            placeholder="例：放課後のストラトキャスター"
            class="w-full bg-black/60 border-2 border-white/25 focus:border-sol-yellow rounded-lg px-4 py-3 text-sm text-white placeholder-neutral-500 outline-none transition-colors"
          />
        </div>

        <!-- Field 2: 内容 -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="inputMessage" class="block text-sm font-bold text-white">
              内容 <span class="text-sol-yellow">*</span>
            </label>
            <span class="text-xs text-neutral-400">
              <span id="charCountDisplay">0</span> / 1000文字
            </span>
          </div>
          <textarea
            id="inputMessage"
            rows="5"
            required
            maxlength="1000"
            placeholder="番組へのメッセージや、リクエストしたい曲名・アーティスト名・エピソードを書いてください。"
            class="w-full bg-black/60 border-2 border-white/25 focus:border-sol-yellow rounded-lg p-4 text-sm text-white placeholder-neutral-500 outline-none leading-relaxed transition-colors"
          ></textarea>
        </div>

        <!-- Error Message -->
        <div id="formErrorBanner" class="hidden bg-black border-2 border-sol-yellow text-sol-yellow px-4 py-2.5 rounded-lg text-xs font-bold">
          <span id="formErrorText">ラジオネームと内容を入力してください。</span>
        </div>

        <!-- Submit Button -->
        <div class="pt-1">
          <button
            type="submit"
            id="btnSubmitLetter"
            class="sol-btn w-full bg-sol-yellow hover:bg-[#fff04d] text-black font-display text-base py-3.5 px-6 rounded-lg border-2 border-black"
          >
            Submit
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- FOOTER -->
  <footer class="border-t border-white/10 py-5 px-4 text-xs text-neutral-500">
    <div class="max-w-3xl mx-auto">
      <span>FM森田 お便り･リクエスト募集フォーム</span>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwh55Ln4wv16SiCqQ5mSdPbz9t8m47mvTurGgl3xWzPl8mJT0rDNuSUzES-mAvhbSJ-RQ/exec';

      function getNowFormatted() {
        var d = new Date();
        var yyyy = d.getFullYear();
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        var dd = String(d.getDate()).padStart(2, '0');
        var hh = String(d.getHours()).padStart(2, '0');
        var mi = String(d.getMinutes()).padStart(2, '0');
        return yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi;
      }

      function showToast(msg) {
        var container = document.getElementById('toastContainer');
        if (!container) return;
        var el = document.createElement('div');
        el.className = 'sol-btn pointer-events-auto bg-sol-yellow text-black border-2 border-black px-4 py-2.5 rounded-lg text-xs font-bold';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2600);
      }

      function init() {
        var inputName = document.getElementById('inputRadioName');
        var inputMsg = document.getElementById('inputMessage');
        var charCount = document.getElementById('charCountDisplay');
        var errBanner = document.getElementById('formErrorBanner');

        inputMsg.addEventListener('input', function () {
          charCount.textContent = String(inputMsg.value.length);
        });

        var successBanner = document.getElementById('formSuccessBanner');
        var successTimer = null;

        document.getElementById('radioSubmissionForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var name = inputName.value.trim();
          var msg = inputMsg.value.trim();

          if (!name || !msg) {
            if (successBanner) successBanner.classList.add('hidden');
            errBanner.classList.remove('hidden');
            return;
          }
          errBanner.classList.add('hidden');

          var newItem = {
            id: 'MORITA-' + String(Date.now()).slice(-5),
            createdAt: getNowFormatted(),
            radioName: name,
            message: msg,
            starred: false,
            status: 'unread'
          };

          inputName.value = '';
          inputMsg.value = '';
          charCount.textContent = '0';

          if (successBanner) {
            successBanner.classList.remove('hidden');
            if (successTimer) clearTimeout(successTimer);
            successTimer = setTimeout(function () {
              successBanner.classList.add('hidden');
            }, 4000);
          }
          showToast('ありがとうございます、送信しました！');

          fetch(GOOGLE_APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify({
              id: newItem.id,
              createdAt: newItem.createdAt,
              radioName: newItem.radioName,
              message: newItem.message,
              status: newItem.status
            })
          }).catch(function () {
            inputName.value = name;
            inputMsg.value = msg;
            charCount.textContent = String(msg.length);
            if (successBanner) successBanner.classList.add('hidden');
            showToast('送信できませんでした。入力内容を戻しました');
          });
        });
      }

      init();
    })();
  </script>
</body>
</html>
